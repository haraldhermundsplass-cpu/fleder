<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Fleder</title>
  <meta name="theme-color" content="#e9edf2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fleder">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/fleder-icon-180.png">
</head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('/app-source?v=annual-year-icons1',{cache:'no-store'});
    if(!response.ok) throw new Error('Kunne ikke laste Fleder');
    let html=await response.text();

    const pwaHead=`
<meta name="theme-color" content="#e9edf2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleder">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/fleder-icon-180.png">`;

    html=html.replace('<head>','<head>'+pwaHead);
    html=html.replace('<title>Faglig leder – trafikkskole</title>','<title>Fleder</title>');

    // Disse tre er kurs innenfor klassene, ikke egne klasser.
    html=html.replace(/,'MC grunnkurs'/g,'');
    html=html.replace(/,'Sikkerhetskurs bane'/g,'');
    html=html.replace(/,'Sikkerhetskurs vei'/g,'');

    // Rydd også bort kursene fra allerede lagrede lærer-/skolevalg.
    html=html.replace(
      "function mapTeacher(t){return {id:t.id,name:t.name||'',email:t.email||'',classes:t.classes||[],approvals:t.approvals||[],userId:t.user_id||null}}",
      "function mapTeacher(t){const hidden=new Set(['MC grunnkurs','Sikkerhetskurs bane','Sikkerhetskurs vei']);return {id:t.id,name:t.name||'',email:t.email||'',classes:(t.classes||[]).filter(c=>!hidden.has(c)),approvals:t.approvals||[],userId:t.user_id||null}}"
    );
    html=html.replace(
      "function mapSchool(s){return {id:'main',schoolName:s?.name||'',orgNumber:s?.org_number||'',leader:s?.leader_name||'',email:s?.email||'',phone:s?.phone||'',year:s?.plan_year||new Date().getFullYear(),classes:s?.classes||[]}}",
      "function mapSchool(s){const hidden=new Set(['MC grunnkurs','Sikkerhetskurs bane','Sikkerhetskurs vei']);return {id:'main',schoolName:s?.name||'',orgNumber:s?.org_number||'',leader:s?.leader_name||'',email:s?.email||'',phone:s?.phone||'',year:s?.plan_year||new Date().getFullYear(),classes:(s?.classes||[]).filter(c=>!hidden.has(c))}}"
    );

    // Vis år som egen kolonne i årsplanen.
    html=html.replace(
      '<th>Type</th><th>Planlagt</th><th>Status</th>',
      '<th>Type</th><th>Planlagt måned</th><th>År</th><th>Status</th>'
    );
    html=html.replace(
      '<td>${esc(a.month)}</td><td><span class="tag ${a.status===\'Gjennomført\'?\'ok\':\'warn\'}">',
      '<td>${esc(a.month)}</td><td>${esc(a.year||state.settings.year||\'\')}</td><td><span class="tag ${a.status===\'Gjennomført\'?\'ok\':\'warn\'}">'
    );
    html=html.replace(
      '<tr><td colspan="6" class="muted">Ingen aktiviteter planlagt.</td></tr>',
      '<tr><td colspan="7" class="muted">Ingen aktiviteter planlagt.</td></tr>'
    );

    // Legg til valg av år i samme skjema som måned.
    html=html.replace(
      '</select></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn">Lagre</button></div></form>`);const ft=$(\'afTeacher\'),fc=$(\'afClass\');',
      '</select></div><div class="field"><label>År</label><input id="afYear" type="number" min="2020" max="2100" value="${state.settings.year||new Date().getFullYear()}" required></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn">Lagre</button></div></form>`);const ft=$(\'afTeacher\'),fc=$(\'afClass\');'
    );
    html=html.replace(
      "month:$('afMonth').value,status:'Planlagt',year:state.settings.year",
      "month:$('afMonth').value,status:'Planlagt',year:Number($('afYear').value)||state.settings.year"
    );

    html=html.replace('</body>',`<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=5').catch(()=>{}));}
<\/script></body>`);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main style="font-family:system-ui;padding:32px;max-width:640px;margin:auto"><h1>Fleder</h1><p>Appen kunne ikke lastes akkurat nå. Kontroller internettilkoblingen og prøv igjen.</p></main>';
  }
})();
</script>
</body>
</html>
