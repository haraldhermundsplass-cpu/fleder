<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Fleder</title>
  <meta name="theme-color" content="#e9edf2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fleder">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/fleder-icon-180.png">
</head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('/app-source?v=forgot-password1',{cache:'no-store'});
    if(!response.ok) throw new Error('Kunne ikke laste Fleder');
    let html=await response.text();

    const pwaHead=`
<meta name="theme-color" content="#e9edf2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleder">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/fleder-icon-180.png">`;

    html=html.replace('<head>','<head>'+pwaHead);
    html=html.replace('<title>Faglig leder – trafikkskole</title>','<title>Fleder</title>');

    // Disse tre er kurs innenfor klassene, ikke egne klasser.
    html=html.replace(/,'MC grunnkurs'/g,'');
    html=html.replace(/,'Sikkerhetskurs bane'/g,'');
    html=html.replace(/,'Sikkerhetskurs vei'/g,'');

    // Rydd også bort kursene fra allerede lagrede lærer-/skolevalg.
    html=html.replace(
      "function mapTeacher(t){return {id:t.id,name:t.name||'',email:t.email||'',classes:t.classes||[],approvals:t.approvals||[],userId:t.user_id||null}}",
      "function mapTeacher(t){const hidden=new Set(['MC grunnkurs','Sikkerhetskurs bane','Sikkerhetskurs vei']);return {id:t.id,name:t.name||'',email:t.email||'',classes:(t.classes||[]).filter(c=>!hidden.has(c)),approvals:t.approvals||[],userId:t.user_id||null}}"
    );
    html=html.replace(
      "function mapSchool(s){return {id:'main',schoolName:s?.name||'',orgNumber:s?.org_number||'',leader:s?.leader_name||'',email:s?.email||'',phone:s?.phone||'',year:s?.plan_year||new Date().getFullYear(),classes:s?.classes||[]}}",
      "function mapSchool(s){const hidden=new Set(['MC grunnkurs','Sikkerhetskurs bane','Sikkerhetskurs vei']);return {id:'main',schoolName:s?.name||'',orgNumber:s?.org_number||'',leader:s?.leader_name||'',email:s?.email||'',phone:s?.phone||'',year:s?.plan_year||new Date().getFullYear(),classes:(s?.classes||[]).filter(c=>!hidden.has(c))}}"
    );

    // Vis år som egen kolonne i årsplanen.
    html=html.replace(
      '<th>Type</th><th>Planlagt</th><th>Status</th>',
      '<th>Type</th><th>Planlagt måned</th><th>År</th><th>Status</th>'
    );
    html=html.replace(
      '<td>${esc(a.month)}</td><td><span class="tag ${a.status===\'Gjennomført\'?\'ok\':\'warn\'}">',
      '<td>${esc(a.month)}</td><td>${esc(a.year||state.settings.year||\'\')}</td><td><span class="tag ${a.status===\'Gjennomført\'?\'ok\':\'warn\'}">'
    );
    html=html.replace(
      '<tr><td colspan="6" class="muted">Ingen aktiviteter planlagt.</td></tr>',
      '<tr><td colspan="7" class="muted">Ingen aktiviteter planlagt.</td></tr>'
    );

    // Legg til valg av år i samme skjema som måned.
    html=html.replace(
      '</select></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn">Lagre</button></div></form>`);const ft=$(\'afTeacher\'),fc=$(\'afClass\');',
      '</select></div><div class="field"><label>År</label><input id="afYear" type="number" min="2020" max="2100" value="${state.settings.year||new Date().getFullYear()}" required></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn">Lagre</button></div></form>`);const ft=$(\'afTeacher\'),fc=$(\'afClass\');'
    );
    html=html.replace(
      "month:$('afMonth').value,status:'Planlagt',year:state.settings.year",
      "month:$('afMonth').value,status:'Planlagt',year:Number($('afYear').value)||state.settings.year"
    );

    // Glemt passord på innloggingssiden.
    html=html.replace(
      '<button class="btn" id="authSubmit">Logg inn</button><div id="authMsg" class="authMsg"></div>',
      '<button class="btn" id="authSubmit">Logg inn</button><button type="button" class="btn secondary" id="forgotPasswordBtn" style="margin-left:8px">Glemt passord?</button><div id="authMsg" class="authMsg"></div>'
    );
    html=html.replace(
      "$('authPassword').autocomplete=mode==='login'?'current-password':'new-password';$('authMsg').innerHTML=''",
      "$('authPassword').autocomplete=mode==='login'?'current-password':'new-password';const fp=$('forgotPasswordBtn');if(fp)fp.classList.toggle('hidden',mode!=='login');$('authMsg').innerHTML=''"
    );
    html=html.replace(
      "$('authTabLogin').onclick=()=>setAuthMode('login');$('authTabLeader').onclick=()=>setAuthMode('leader');$('authTabTeacher').onclick=()=>setAuthMode('teacher');",
      "$('authTabLogin').onclick=()=>setAuthMode('login');$('authTabLeader').onclick=()=>setAuthMode('leader');$('authTabTeacher').onclick=()=>setAuthMode('teacher');const forgotBtn=$('forgotPasswordBtn');if(forgotBtn)forgotBtn.onclick=async()=>{const email=$('authEmail').value.trim();if(!email){$('authMsg').innerHTML='<div class=\"notice warn\">Skriv inn e-postadressen din først.</div>';$('authEmail').focus();return}try{forgotBtn.disabled=true;$('authMsg').innerHTML='<div class=\"notice\">Sender lenke for nytt passord…</div>';const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(r.error)throw r.error;$('authMsg').innerHTML='<div class=\"notice ok\">✓ Vi har sendt en lenke til '+esc(email)+'. Åpne lenken i e-posten for å lage nytt passord.</div>'}catch(err){console.error(err);$('authMsg').innerHTML='<div class=\"notice warn\">'+esc(err.message||'Kunne ikke sende e-post for nytt passord.')+'</div>'}finally{forgotBtn.disabled=false}};"
    );
    html=html.replace(
      "sb.auth.onAuthStateChange((event,newSession)=>{if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED')&&newSession&&!session){session=newSession;setTimeout(()=>startAuthenticated(),0)}});",
      "sb.auth.onAuthStateChange((event,newSession)=>{if(event==='PASSWORD_RECOVERY'&&newSession){session=newSession;setTimeout(()=>{showModal('Lag nytt passord',`<form id=\"resetPasswordForm\"><div class=\"field\"><label>Nytt passord</label><input id=\"newPassword\" type=\"password\" minlength=\"8\" required autocomplete=\"new-password\"></div><div class=\"field\" style=\"margin-top:12px\"><label>Gjenta nytt passord</label><input id=\"newPassword2\" type=\"password\" minlength=\"8\" required autocomplete=\"new-password\"></div><div id=\"resetPasswordMsg\" class=\"authMsg\"></div><div style=\"display:flex;justify-content:flex-end;margin-top:16px\"><button class=\"btn\">Lagre nytt passord</button></div></form>`);$('resetPasswordForm').onsubmit=async e=>{e.preventDefault();const p1=$('newPassword').value,p2=$('newPassword2').value;if(p1!==p2){$('resetPasswordMsg').innerHTML='<div class=\"notice warn\">Passordene er ikke like.</div>';return}try{const r=await sb.auth.updateUser({password:p1});if(r.error)throw r.error;$('resetPasswordMsg').innerHTML='<div class=\"notice ok\">✓ Passordet er endret. Du kan nå bruke det nye passordet.</div>';setTimeout(()=>location.href=location.origin,1200)}catch(err){$('resetPasswordMsg').innerHTML='<div class=\"notice warn\">'+esc(err.message||'Kunne ikke endre passordet.')+'</div>'}}},0);return}if((event==='SIGNED_IN'||event==='TOKEN_REFRESHED')&&newSession&&!session){session=newSession;setTimeout(()=>startAuthenticated(),0)}});"
    );

    html=html.replace('</body>',`<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=5').catch(()=>{}));}
<\/script></body>`);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main style="font-family:system-ui;padding:32px;max-width:640px;margin:auto"><h1>Fleder</h1><p>Appen kunne ikke lastes akkurat nå. Kontroller internettilkoblingen og prøv igjen.</p></main>';
  }
})();
</script>
</body>
</html>
